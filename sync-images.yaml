# 批量同步镜像列表
#
# 用法：Actions → Sync Docker Image → mode 选 batch → 选 target_registry → Run
# 目标仓库整表共用一个：由触发时的 target_registry 决定，本文件不写仓库。
#
# 每个条目支持两种写法：
#   1) 纯字符串：只给镜像引用，tag 跟随源、目标名取最后一段
#   2) 对象：source 必填；可选字段：
#        target  覆盖目标镜像名（默认取 source 最后一段，自动去掉 library: 前缀）
#        tag     覆盖目标标签 / retag（默认跟随源 tag）
#                例如 source: nginx:1.25.3 + tag: stable → 拉 1.25.3，推 stable
#
# 源镜像须为公开可拉取（沿用 --src-no-creds）。单条失败不会中断整批。

images:
  # 对象写法
  - source: registry.k8s.io/kueue/kueue:v0.8.1
  # kube-rbac-proxy v0.8.0 已无公开源（GCR 仓库已清空，quay.io/brancz 仅剩 master 滚动 tag），暂跳过
  # - source: gcr.io/kubebuilder/kube-rbac-proxy:v0.8.0
  - source: docker.io/mpioperator/mpi-operator:0.6.0
  - source: docker.io/mpioperator/kubectl-delivery:0.2.0
    target: mpi-kubectl                # 保持原目标仓库名（源换为 kubectl-delivery）
  - source: rancher/local-path-provisioner:v0.0.28
  - source: docker.io/mpioperator/mpich:v0.6.0
    target: mpich-ubuntu               # 保持原目标仓库名（源换为 mpioperator/mpich）

  # 纯字符串写法（等价于只写 source）
  # - hello-world:latest
