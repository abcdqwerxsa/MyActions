# 批量同步镜像列表
#
# 用法：Actions → Sync Docker Image → mode 选 batch → 选 target_registry → Run
# 目标仓库整表共用一个：由触发时的 target_registry 决定，本文件不写仓库。
#
# 每个条目支持两种写法：
#   1) 纯字符串：只给镜像引用，tag 跟随源、目标名取最后一段
#   2) 对象：source 必填；可选字段：
#        target  覆盖目标镜像名（默认取 source 最后一段，自动去掉 library: 前缀）
#        tag     覆盖目标标签 / retag（默认跟随源 tag）
#                例如 source: nginx:1.25.3 + tag: stable → 拉 1.25.3，推 stable
#
# 源镜像须为公开可拉取（沿用 --src-no-creds）。单条失败不会中断整批。

images:
  # 对象写法
  - source: registry.k8s.io/kueue/kueue:v0.8.1
  - source: gcr.io/kubebuilder/kube-rbac-proxy:v0.8.0
  - source: docker.io/kubeflow/mpi-operator:v0.6.0
  - docker.io/kubeflow/mpi-kubectl:v0.6.0
  - rancher/local-path-provisioner:v0.0.28
  - docker.io/mpiuniverse/mpich-ubuntu:latest

  # 纯字符串写法（等价于只写 source）
  # - hello-world:latest
