name: Diag GitCode Push

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      SLUG_OWNER: weqwrwqrczxx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push matrix with fixed config passing
        run: |
          set +e  # runner forces bash -e; we handle errors explicitly
          api="https://gitcode.com/api/v5"

          mkrepo() {
            curl -sS -X POST "$api/user/repos" \
              -d "access_token=${GITCODE_TOKEN}" \
              --data-urlencode "name=$1" \
              -d "private=true" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("full_name") or d)'
          }
          rmrepo() { curl -sS -X DELETE "$api/repos/$1?access_token=${GITCODE_TOKEN}" -o /dev/null -w "cleanup $1: %{http_code}\n"; }

          # push_from <label> <slug> <workdir> [key val ...]
          push_from() {
            local label="$1" slug="$2" wd="$3"; shift 3
            local url="https://${SLUG_OWNER}:${GITCODE_TOKEN}@gitcode.com/${slug}.git"
            while [[ $# -gt 0 ]]; do git -C "$wd" config "$1" "$2"; shift 2; done
            local t0=$SECONDS
            ( cd "$wd" && timeout 150 git push --progress "$url" HEAD:refs/heads/main ) > /tmp/push.log 2>&1
            local rc=$?
            echo "[$label] exit=$rc elapsed=$((SECONDS-t0))s"
            tr '\r' '\n' < /tmp/push.log | grep -vE "^\s*$" | tail -4 | sed 's/^/    /'
          }

          echo "git version: $(git --version)"

          echo "== [T] tiny repo (1 file, default config) =="
          mkdir -p /tmp/tiny && cd /tmp/tiny && git init -q -b main . && git config user.email t@t && git config user.name t
          echo hello > f.txt && git add . && git commit -qm tiny
          t="$(mkrepo diag-push-t)"; echo "tiny repo slug: $t"
          push_from T "$t" /tmp/tiny

          echo "== [B] full repo + postBuffer 500MB =="
          b="$(mkrepo diag-push-b)"; echo "repo slug: $b"
          push_from B "$b" "$GITHUB_WORKSPACE" http.postBuffer 524288000

          echo "== [C] full repo + HTTP/1.1 + postBuffer =="
          c="$(mkrepo diag-push-c)"; echo "repo slug: $c"
          push_from C "$c" "$GITHUB_WORKSPACE" http.version HTTP/1.1 http.postBuffer 524288000

          rmrepo "$t"; rmrepo "$b"; rmrepo "$c"
          echo DONE
