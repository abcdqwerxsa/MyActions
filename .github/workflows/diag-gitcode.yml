name: Diag GitCode Push

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      SLUG_OWNER: weqwrwqrczxx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: API upload path + long-patience git push
        run: |
          set +e
          api="https://gitcode.com/api/v5"
          slug="${SLUG_OWNER}/diag-api-up"

          echo "== [A1] create test repo + release =="
          curl -sS -X POST "$api/user/repos" -d "access_token=${GITCODE_TOKEN}" \
            --data-urlencode "name=diag-api-up" -d "private=false" | head -c 120; echo
          curl -sS -X POST "$api/repos/${slug}/releases" \
            -d "access_token=${GITCODE_TOKEN}" -d "tag_name=diag" \
            --data-urlencode "name=diag" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("release id:", d.get("id")); sys.exit(0 if d.get("id") else 1)'
          rid=$(curl -sS "$api/repos/${slug}/releases/tags/diag?access_token=${GITCODE_TOKEN}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          echo "== [A2] small asset (170B) via attach_files =="
          echo "small test $(date -Is)" > /tmp/small.bin
          t0=$SECONDS
          timeout 60 curl -sS -X POST "$api/repos/${slug}/releases/${rid}/attach_files" \
            -F "access_token=${GITCODE_TOKEN}" -F "file=@/tmp/small.bin" | head -c 300; echo
          echo "[A2] elapsed=$((SECONDS-t0))s"

          echo "== [A3] big asset (12MB) via attach_files =="
          head -c 12M /dev/urandom > /tmp/big.bin
          t0=$SECONDS
          timeout 240 curl -sS -X POST "$api/repos/${slug}/releases/${rid}/attach_files" \
            -F "access_token=${GITCODE_TOKEN}" -F "file=@/tmp/big.bin" -o /tmp/big-resp.json -w "http=%{http_code} uploaded=%{size_upload}B speed=%{speed_upload}B/s\n"
          echo "[A3] elapsed=$((SECONDS-t0))s"; head -c 300 /tmp/big-resp.json; echo

          echo "== [L] git push patience test (420s) =="
          git config http.version HTTP/1.1
          git config http.postBuffer 524288000
          url="https://${SLUG_OWNER}:${GITCODE_TOKEN}@gitcode.com/${slug}.git"
          git update-ref refs/heads/testmain "$(git rev-parse HEAD)"
          t0=$SECONDS
          timeout 420 git push --progress "$url" refs/heads/testmain:refs/heads/main > /tmp/push.log 2>&1
          rc=$?
          echo "[L] exit=$rc elapsed=$((SECONDS-t0))s"
          tr '\r' '\n' < /tmp/push.log | grep -vE "^\s*$" | tail -4 | sed 's/^/    /'

          echo "== cleanup =="
          curl -sS -X DELETE "$api/repos/${slug}?access_token=${GITCODE_TOKEN}" -o /dev/null -w "rm repo: %{http_code}\n"
          for r in diag-push-t diag-push-b diag-push-c diag-push-a; do
            curl -sS -X DELETE "$api/repos/${SLUG_OWNER}/${r}?access_token=${GITCODE_TOKEN}" -o /dev/null -w "rm $r: %{http_code}\n"
          done
          echo DONE
