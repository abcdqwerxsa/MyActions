name: Sync to GitCode

# MyActions 自身的 GitCode 同步（也是 sync-to-gitcode.yml 的端到端示例）。
# verify job 做自证：从 GitCode 下载附件，与 GitHub release 的 sha256 比对。

on:
  push:
    branches: [main]
    tags: ['*']
  release:
    types: [published]

jobs:
  sync:
    uses: ./.github/workflows/sync-to-gitcode.yml
    with:
      gitcode_repo: weqwrwqrczxx/MyActions
    secrets:
      gitcode_token: ${{ secrets.GITCODE_TOKEN }}

  verify:
    needs: sync
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITCODE_API: https://gitcode.com/api/v5
      SLUG: weqwrwqrczxx/MyActions
      TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - name: Download asset from GitCode and compare sha256 with GitHub
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          rid="$(curl -fsS "${GITCODE_API}/repos/${SLUG}/releases/tags/${tag}?access_token=${TOKEN}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          url="$(curl -fsS "${GITCODE_API}/repos/${SLUG}/releases/${rid}/attach_files?access_token=${TOKEN}" \
            | python3 -c 'import json,sys; a=json.load(sys.stdin); print(a[0]["browser_download_url"])')"
          echo "GitCode download URL: ${url}"
          curl -fsSL "${url}" -o /tmp/dl.bin
          gc_sha="$(sha256sum /tmp/dl.bin | cut -d' ' -f1)"
          gh_sha="$(gh release view "${tag}" --json assets --jq '.assets[0].digest' | sed 's/^sha256://')"
          echo "GitCode sha256: ${gc_sha}"
          echo "GitHub sha256:  ${gh_sha}"
          [[ "${gc_sha}" == "${gh_sha}" ]] && echo "VERDICT: MATCH" || { echo "VERDICT: MISMATCH"; exit 1; }
